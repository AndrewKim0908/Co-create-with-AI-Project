@font-face {

}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { font-family: 'Inter', system-ui, sans-serif; background: #FAFBFC; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #C5D0D9; border-radius: 3px; }

@keyframes pulse-ring {
  0%   { box-shadow: 0 0 0 0 rgba(208,80,69,0.6), 0 0 0 0 rgba(208,80,69,0.3); }
  70%  { box-shadow: 0 0 0 8px rgba(208,80,69,0), 0 0 0 14px rgba(208,80,69,0); }
  100% { box-shadow: 0 0 0 0 rgba(208,80,69,0), 0 0 0 0 rgba(208,80,69,0); }
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.15); }
}
@keyframes option-glow {
  0%, 100% { box-shadow: 0 0 0 2px rgba(30,138,90,0.4), 0 4px 16px rgba(30,138,90,0.12); }
  50% { box-shadow: 0 0 0 3px rgba(30,138,90,0.7), 0 6px 24px rgba(30,138,90,0.22); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(16px); }
  to   { opacity: 1; transform: translateX(0); }
}
.fade-in { animation: fadeIn 0.3s cubic-bezier(0.2,0,0,1) both; }
.slide-in { animation: slideIn 0.25s cubic-bezier(0.2,0,0,1) both; }

        <button key={code} onClick={() => setLang(code)}

// ─── ICON HELPER ─────────────────────────────────────────────
const Icon = ({ name, size = 16, color, style = {} }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      ref.current.appendChild(el);
      window.lucide.createIcons({ nodes: [el] });
      const svg = ref.current.querySelector('svg');
      if (svg) {
        svg.style.width = size + 'px';
        svg.style.height = size + 'px';
        if (color) svg.style.color = color;
      }
    }
  }, [name, size, color]);
  return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', flexShrink: 0, ...style }} />;
};

const Btn = ({ children, variant = 'default', size = 'md', onClick, disabled, style = {} }) => {
  const [hov, setHov] = useState(false);
  const [press, setPress] = useState(false);
  const variants = {
    primary: { bg: hov ? C.emeraldHover : C.emerald, color: '#fff', border: 'none' },
    danger:  { bg: hov ? C.coralHover   : C.coral,   color: '#fff', border: 'none' },
    ghost:   { bg: hov ? C.muted : 'transparent', color: C.fg2, border: `1px solid ${hov ? C.border : 'transparent'}` },
    default: { bg: hov ? C.subtle : C.white, color: C.fg2, border: `1px solid ${C.border}` },
  };
  const sizes = {
    sm: { fontSize: 11, padding: '5px 11px' },
    md: { fontSize: 13, padding: '7px 14px' },
    lg: { fontSize: 14, padding: '10px 20px', fontWeight: 600 },
  };
  const v = variants[variant]; const s = sizes[size];
  return (
    <button onClick={onClick} disabled={disabled}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => { setHov(false); setPress(false); }}
      onMouseDown={() => setPress(true)} onMouseUp={() => setPress(false)}
      style={{ ...s, background: v.bg, color: v.color, border: v.border, borderRadius: 4, fontWeight: 500,
        fontFamily: 'Inter, system-ui, sans-serif', cursor: disabled ? 'default' : 'pointer',
        transition: 'background 120ms, box-shadow 120ms', transform: press ? 'scale(0.985)' : 'scale(1)',
        opacity: disabled ? 0.5 : 1, display: 'inline-flex', alignItems: 'center', gap: 6, ...style }}>

  );
};

// ─── RADAR CHART ─────────────────────────────────────────────
const RadarChart = () => {
  const lang = useLang();
  const axes = [t(lang,'radarCost'),t(lang,'radarPerf'),t(lang,'radarDura'),t(lang,'radarMfg'),t(lang,'radarTime'),t(lang,'radarSafe')];
  const n = axes.length, cx = 90, cy = 90, r = 65;
  const engineer = [0.55, 0.85, 0.75, 0.95, 0.5, 0.8];
  const designer  = [0.7,  0.7,  0.95, 0.55, 0.4, 0.9];
  const optionC   = [0.75, 0.82, 0.88, 0.85, 0.78, 0.87];
  const pt = (val, i) => { const a = (Math.PI*2*i/n) - Math.PI/2; return { x: cx + r*val*Math.cos(a), y: cy + r*val*Math.sin(a) }; };
  const pts = (vals) => vals.map((v,i) => pt(v,i)).map(p => `${p.x},${p.y}`).join(' ');
  const axisEnd = (i) => pt(1.08, i);
  return (
    <svg width="180" height="180" viewBox="0 0 180 180">
      {[0.25,0.5,0.75,1].map(lvl => <polygon key={lvl} points={axes.map((_,i)=>pt(lvl,i)).map(p=>`${p.x},${p.y}`).join(' ')} fill="none" stroke="#E2E8ED" strokeWidth="0.8"/>)}
      {axes.map((ax,i) => { const end = axisEnd(i); return <g key={ax}><line x1={cx} y1={cy} x2={end.x} y2={end.y} stroke="#C5D0D9" strokeWidth="0.8"/><text x={end.x+(end.x-cx)*0.12} y={end.y+(end.y-cy)*0.12+3} textAnchor="middle" style={{ fontSize: 8, fill: '#62788A', fontFamily: 'Inter,sans-serif' }}>{ax}</text></g>; })}
      <polygon points={pts(engineer)} fill="rgba(62,106,165,0.10)" stroke="#3A6EA5" strokeWidth="1.5" strokeDasharray="3,2"/>
      <polygon points={pts(designer)}  fill="rgba(208,80,69,0.08)"  stroke="#D05045" strokeWidth="1.5" strokeDasharray="3,2"/>
      <polygon points={pts(optionC)}   fill="rgba(30,138,90,0.12)"  stroke="#1E8A5A" strokeWidth="2"/>
      {[{color:'#3A6EA5',label:'Engineer'},{color:C.coral,label:'Designer'},{color:C.emerald,label:'Option C'}].map((l,i)=>(
        <g key={l.label} transform={`translate(4,${155+i*9})`}><rect width="10" height="2" y="3" fill={l.color} rx="1"/><text x="14" y="8" style={{ fontSize: 8, fill: '#62788A', fontFamily: 'Inter,sans-serif' }}>{l.label}</text></g>
      ))}
    </svg>
  );
};

  const lang = useLang();
  const [activePin, setActivePin] = useState(1);
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <Topbar title={t(lang,'workspaceTitle')} subtitle={t(lang,'workspaceSub')} status="deadlock" lang={lang} />
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
        <BlueprintViewer activePin={activePin} onPinClick={setActivePin} />
        <ChatPanel />
        <ConflictPanel onApprove={onApprove} onReject={onReject} />
      </div>
    </div>
  );
};

      <div className="fade-in" style={{ maxWidth: 600, width: '100%' }}>
        <div style={{ textAlign: 'center', marginBottom: 32 }}>
          <div style={{ width: 56, height: 56, borderRadius: '50%', background: C.emeraldLight, border: `2px solid ${C.emerald}`, display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px' }}>
            <Icon name="check-circle" size={28} color={C.emerald} />
          </div>
          <div style={{ fontSize: 22, fontWeight: 700, color: C.fg1, marginBottom: 6 }}>{t(lang,'consensusTitle')}</div>
          <div style={{ fontSize: 14, color: C.fg3 }}>{t(lang,'consensusSub')}</div>
        </div>
        <div style={{ background: C.white, borderRadius: 8, border: `1px solid ${C.borderSubtle}`, boxShadow: '0 4px 16px rgba(30,42,53,0.08)', overflow: 'hidden' }}>
          <div style={{ padding: '16px 20px', borderBottom: `1px solid ${C.borderSubtle}`, display: 'flex', alignItems: 'center', gap: 10 }}>
            <Icon name="file-text" size={16} color={C.fg3} />
            <span style={{ fontSize: 14, fontWeight: 600, color: C.fg1 }}>{t(lang,'decisionRecord')}</span>
            <span style={{ marginLeft: 'auto', fontSize: 10, fontFamily: 'monospace', color: C.fg4 }}>2026-04-24 14:32 KST</span>
          </div>
          <div style={{ padding: '20px', display: 'flex', flexDirection: 'column', gap: 16 }}>
            {[
              { label: t(lang,'drConflict'),   value: t(lang,'drConflictVal') },
              { label: t(lang,'drResolution'), value: t(lang,'drResolutionVal') },
              { label: t(lang,'drOutcome'),    value: t(lang,'drOutcomeVal') },
              { label: t(lang,'drApprovals'),  value: t(lang,'drApprovalsVal') },
            ].map(r => (
              <div key={r.label}>
                <div style={{ fontSize: 10, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', color: C.fg3, marginBottom: 4 }}>{r.label}</div>

            </div>
          </div>

// ─── ROOT APP ────────────────────────────────────────────────
const ROLE_MAP = {
  engineer: { name: 'Lee Sungmin', initials: 'LS', role: 'engineer', roleLabel: { en: 'Hardware Engineer', ko: '하드웨어 엔지니어', zh: '硬件工程师' } },
  designer: { name: 'Andrew Kim',  initials: 'AK', role: 'designer', roleLabel: { en: 'Product Designer',  ko: '제품 디자이너',      zh: '产品设计师' } },
  lead:     { name: 'Kim Jiyeon',  initials: 'KJ', role: 'lead',     roleLabel: { en: 'Lead User',          ko: '리드 유저',          zh: '主要用户' } },
};

const App = () => {
  const [screen, setScreen] = useState('login');
  const [nav, setNav] = useState('sprints');
  const [user, setUser] = useState(null);
  const [lang, setLang] = useState('en');

  const handleLogin = (role) => {
    const u = ROLE_MAP[role];
    setUser({ ...u, roleLabel: u.roleLabel[lang] || u.roleLabel.en });
    setScreen('workspace');
    setNav('sprints');
  };

  const handleNav = (id) => {
    setNav(id);
    if (id === 'hub')      setScreen('hub');
    if (id === 'timeline') setScreen('timeline');
    if (id === 'sprints' || id === 'conflicts') setScreen('workspace');
  };

  // Update user roleLabel when lang changes
  useEffect(() => {
    if (user) {
      const u = ROLE_MAP[user.role];
      setUser(prev => ({ ...prev, roleLabel: u.roleLabel[lang] || u.roleLabel.en }));
    }
  }, [lang]);

  if (screen === 'login') return (
    <LangCtx.Provider value={lang}>
      <LoginScreen onLogin={handleLogin} lang={lang} setLang={setLang} />
    </LangCtx.Provider>
  );

  return (
    <LangCtx.Provider value={lang}>
      <div style={{ display: 'flex', height: '100vh', fontFamily: 'Inter, system-ui, sans-serif' }}>
        <Sidebar active={nav} onNav={handleNav} user={user} />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: C.bg }}>
          {screen === 'hub' && (
            <>
              <Topbar title={t(lang,'hubTitle')} subtitle={`${t(lang,'hubWelcome')}, ${user?.name || ''}`} lang={lang} setLang={setLang} />
              <HubScreen onOpen={() => { setScreen('workspace'); setNav('sprints'); }} />
            </>
          )}
          {screen === 'timeline' && (
            <>
              <Topbar title={t(lang,'timelineTitle')} subtitle={t(lang,'timelineSub')} lang={lang} setLang={setLang} />
              <TimelineScreen onOpenSprint={() => { setScreen('workspace'); setNav('sprints'); }} />
            </>
          )}
          {screen === 'workspace' && (
            <WorkspaceScreen onApprove={() => setScreen('consensus')} onReject={() => {}} />
          )}
          {screen === 'consensus' && (
            <>
              <Topbar title={t(lang,'consensusOutput')} subtitle={t(lang,'consensusOutputSub')} onBack={() => setScreen('workspace')} lang={lang} setLang={setLang} />
              <ConsensusScreen onBack={() => setScreen('workspace')} />
            </>
          )}
        </div>
      </div>
    </LangCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
